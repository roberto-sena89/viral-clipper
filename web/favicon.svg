<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" role="img" aria-label="Viral Clipper">
  <!-- Marca: um clipe 9:16 (o produto) com o play vazado ao centro.
       Desenho geometrico, sem dependencia de fonte: renderiza identico a
       16px (aba) e a 512px (atalho). O gradiente e o da marca
       (indigo para lavanda), na mesma diagonal do CSS. -->
  <defs>
    <linearGradient id="vc-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="vc-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232839"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="9" fill="url(#vc-g)"/>
  <!-- moldura: o clipe vertical, um retangulo 9:16 com cantos suaves -->
  <rect x="11.5" y="6" width="13" height="24" rx="3.5" fill="url(#vc-c)"/>
  <!-- fita do clapper no topo: identidade de "corte", nao so de "play" -->
  <rect x="11.5" y="6" width="13" height="4.6" rx="3.5" fill="#f3f4f6" opacity="0.92"/>
  <rect x="11.5" y="8.2" width="13" height="2.4" fill="#0b0d12" opacity="0.85"/>
  <g fill="#f3f4f6" opacity="0.85">
    <rect x="13.1" y="6.5" width="2.1" height="3.6" transform="rotate(18 14.1 8.3)"/>
    <rect x="17.1" y="6.5" width="2.1" height="3.6" transform="rotate(18 18.1 8.3)"/>
    <rect x="21.1" y="6.5" width="2.1" height="3.6" transform="rotate(18 22.1 8.3)"/>
  </g>
  <!-- play vazado, centrado na area util do clipe (abaixo da fita) -->
  <path d="M16.4 14.6v9.4l7.8-4.7z" fill="#fff"/>
</svg>

